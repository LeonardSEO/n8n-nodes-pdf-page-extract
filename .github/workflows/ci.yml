name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Notices changes in n8n, such as how it treats unverified packages, between code changes.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.22.0, 24.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: npm pack --dry-run
      - name: Audit what ships to users
        run: pnpm audit --prod --audit-level high
      - name: Report development tooling advisories
        continue-on-error: true
        run: pnpm audit --audit-level high

  n8n:
    name: Real n8n (${{ matrix.n8n }})
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        # 3.1.0 is pinned because n8n 3 is not the stable release yet.
        n8n: [stable, 3.1.0]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run this commit in n8n
        run: pnpm test:n8n ${{ matrix.n8n }}
      - name: Install the published package through n8n
        run: pnpm test:n8n-install ${{ matrix.n8n }}
