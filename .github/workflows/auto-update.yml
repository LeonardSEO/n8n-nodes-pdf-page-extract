name: Auto Update

# Monthly update of pdfjs-dist, @n8n/node-cli and prettier within their major version.
# A new pdfjs-dist is verified and released to npm automatically. Tooling updates are only
# committed, because they do not change what users install. A failed run opens an issue.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

concurrency:
  group: auto-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          cache: pnpm
      - name: Keep the schedule active
        # GitHub disables scheduled workflows after 60 days without repository activity.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable auto-update.yml
      - name: Select updates
        id: update
        run: node scripts/auto-update.mjs
      - name: Install updates
        if: steps.update.outputs.changed == 'true'
        run: pnpm install --no-frozen-lockfile
      - name: Verify
        if: steps.update.outputs.changed == 'true'
        run: |
          pnpm format
          pnpm lint
          pnpm test
          pnpm test:n8n
          npm pack --dry-run
          pnpm audit --prod --audit-level high
      - name: Commit
        if: steps.update.outputs.changed == 'true'
        env:
          MESSAGE: ${{ steps.update.outputs.message }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Update dependencies" -m "$MESSAGE"
          git push origin main
      - name: Release
        if: steps.update.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.update.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh workflow run publish.yml --ref "$TAG"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue create --title 'Monthly auto-update failed' --body "See $RUN_URL"
