name: Auto Update

# Monthly update of pdfjs-dist, @n8n/node-cli and prettier within their major version.
# A new pdfjs-dist is verified and released to npm automatically. Tooling updates are only
# committed, because they do not change what users install. A failed run opens an issue.
#
# Updated dependencies only run in the verify job, which can read but not change the repository.
# The release job commits the files from the select job, so code run in verify cannot alter them.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

concurrency:
  group: auto-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  keep-active:
    # GitHub disables scheduled workflows after 60 days without repository activity.
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable auto-update.yml --repo "$GITHUB_REPOSITORY"

  select:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      message: ${{ steps.update.outputs.message }}
      release: ${{ steps.update.outputs.release }}
      version: ${{ steps.update.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
      - name: Select updates
        id: update
        run: node scripts/auto-update.mjs
      - name: Update the lockfile without running dependency code
        if: steps.update.outputs.changed == 'true'
        run: pnpm install --lockfile-only --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.update.outputs.changed == 'true'
        with:
          name: update
          path: |
            CHANGELOG.md
            package.json
            pnpm-lock.yaml
          if-no-files-found: error

  verify:
    needs: select
    if: needs.select.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:n8n
      - run: npm pack --dry-run --ignore-scripts
      - run: pnpm audit --prod --audit-level high

  commit-and-release:
    # Installs and runs nothing from the repository or its dependencies.
    needs: [select, verify]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update
      - name: Commit
        env:
          MESSAGE: ${{ needs.select.outputs.message }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md package.json pnpm-lock.yaml
          git commit -m "Update dependencies" -m "$MESSAGE"
          git push origin main
      - name: Release
        if: needs.select.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.select.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh workflow run publish.yml --ref "$TAG"

  report-failure:
    needs: [keep-active, select, verify, commit-and-release]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title 'Monthly auto-update failed' --body "See $RUN_URL"
